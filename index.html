<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phaser Quest</title>
    <style>
        body {
            background: radial-gradient(circle 1200px at center, transparent, #000), url('/assets/sprites/wood.png') repeat, #000;
            margin: 0;
        }
        #game {
            cursor: url('/assets/sprites/hand.png'), auto;
            max-width: 980px;
            max-height: 500px;
            margin-left: auto;
            margin-right: auto;
            padding: 0;
        }
        @font-face {
            font-family: 'pixel';
            src: url('/assets/fonts/advocut-webfont.ttf');
        }
        .fontPreload {
            font-family: 'pixel';
            position: absolute;
            left: -100px;
        }
    </style>
</head>
<body>
    <div class="fontPreload">.</div> <!-- don't forget the dot, the div cannot be empty-->
    <div id='game'></div>
    <script vite-ignore src="/vendor/phaser.js"></script>
    <script vite-ignore src="/vendor/phaser-input.js"></script>
    <script type="module" src="/src/entry-game.js"></script>
</body>
</html>
